[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "campusvision"
version = "0.1.0"
description = "Unified campus-scene understanding with Florence-2"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "gradio>=5,<7",
  "numpy>=1.26,<3",
  "pillow>=10,<13",
  "psutil>=5.9,<8",
  "torch>=2.2,<3",
  "transformers>=4.46,<6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.8,<1",
]

[project.scripts]
campusvision = "campusvision.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
