[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "campusvision"
version = "0.1.0"
description = "Unified campus-scene understanding with Florence-2"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "einops==0.8.2",
  "gradio==5.49.1",
  "numpy==2.4.6",
  "pillow==11.3.0",
  "psutil==7.2.2",
  "torch==2.14.0",
  "torchvision==0.29.0",
  "timm==1.0.30",
  "transformers==4.49.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.8",
]

[project.scripts]
campusvision = "campusvision.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
